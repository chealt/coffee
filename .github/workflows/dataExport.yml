name: Data Export
on:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
jobs:
  data-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GIT_WRITE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Refresh static data
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          yarn export:data:ci
          yarn recommendations:ci
      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            packages/coffee.chealt.com/data/**
      - name: Commit changes
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git config --global user.name 'Chealt GitHub automation'
          git config --global user.email 'info@centralbeans.com'
          git commit -am "Automated data export"
          git push
