name: Fix AWS Errors
on:
  workflow_dispatch:
    inputs:
      taskId:
        description: 'Task id to fix (e.g. 0007). Empty = all open tasks.'
        type: string
      errorContext:
        description: 'Failure details as JSON, sent by the failure handler. Replaces the task file.'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        env:
          TASK_ID: ${{ inputs.taskId }}
          ERROR_CONTEXT: ${{ inputs.errorContext }}
        run: |
          if [ -n "$ERROR_CONTEXT" ]; then
            if ! printf '%s' "$TASK_ID" | grep -Eqx '[A-Za-z0-9._-]+'; then
              echo "::error::Invalid task id"
              exit 1
            fi
            echo "matrix=$(jq -cn --arg id "$TASK_ID" '[$id]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p agent-tasks/open
          ids=$(find agent-tasks/open -name '*.md' 2>/dev/null | sed -E 's#^.*/(.*)\.md$#\1#' | sort -u)
          if [ -n "$TASK_ID" ]; then
            ids=$(printf '%s\n' "$ids" | grep -x "$TASK_ID" || true)
          fi
          matrix=$(printf '%s\n' "$ids" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fix:
    needs: list
    if: needs.list.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # Three nested limits, innermost first so the most informative one fires:
    # AGENT_TIMEOUT_MINUTES stops the agent and reports it, the step timeout catches a wrapper
    # that failed to stop it, and the job timeout catches everything else.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJson(needs.list.outputs.matrix) }}
    # One attempt per task at a time. A running attempt is never cancelled, because failures
    # arriving in a later batch would otherwise kill it. GitHub keeps one waiting run per group
    # and drops the rest, and that run skips once the first has opened its PR.
    concurrency:
      group: errorFix-${{ matrix.task }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Run fix agent for task ${{ matrix.task }}
        timeout-minutes: 8
        run: yarn workspace @centralbeans/error-scanner fix --task ${{ matrix.task }}
        env:
          GH_TOKEN: ${{ github.token }}
          ERROR_CONTEXT: ${{ inputs.errorContext }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-opus-5' }}
          # Budget for the whole run, duplicate check and agent together. Raising it past the
          # step timeout above makes the step the one that fires, which reports nothing useful.
          AGENT_TIMEOUT_MINUTES: '5'
