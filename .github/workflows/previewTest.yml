name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  statuses: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  PREVIEW_HOST: pr-${{ github.event.pull_request.number }}.preview.centralbeans.com
jobs:
  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      # The adapter bakes wrangler.toml into dist/server/wrangler.json at build time and
      # points wrangler at it, so the preview values have to be in place before building
      - name: Configure preview worker
        working-directory: packages/coffee.chealt.com
        run: |
          sed -i \
            -e 's/^name = "coffee"$/name = "coffee-pr-${{ github.event.pull_request.number }}"/' \
            -e 's/pattern = "centralbeans.com"/pattern = "${{ env.PREVIEW_HOST }}"/' \
            -e 's|ORIGIN = "https://centralbeans.com"|ORIGIN = "https://${{ env.PREVIEW_HOST }}"|' \
            -e 's/RELYING_PARTY_ID = "centralbeans.com"/RELYING_PARTY_ID = "${{ env.PREVIEW_HOST }}"/' \
            wrangler.toml
          # Fail fast if wrangler.toml changed in a way the replacements no longer match
          grep -q '^name = "coffee-pr-' wrangler.toml
          grep -q 'pattern = "${{ env.PREVIEW_HOST }}"' wrangler.toml
          grep -q 'ORIGIN = "https://${{ env.PREVIEW_HOST }}"' wrangler.toml
          grep -q 'RELYING_PARTY_ID = "${{ env.PREVIEW_HOST }}"' wrangler.toml
      - name: build
        run: |
          yarn install --immutable
          NODE_ENV=production yarn workspace @centralbeans/website build
      - name: Verify the generated worker config targets the preview
        working-directory: packages/coffee.chealt.com
        run: |
          # wrangler deploys the generated config, so this is what actually reaches Cloudflare
          grep -q '"name":"coffee-pr-${{ github.event.pull_request.number }}"' dist/server/wrangler.json
          grep -q '"pattern":"${{ env.PREVIEW_HOST }}"' dist/server/wrangler.json
          grep -q '"ORIGIN":"https://${{ env.PREVIEW_HOST }}"' dist/server/wrangler.json
          grep -q '"RELYING_PARTY_ID":"${{ env.PREVIEW_HOST }}"' dist/server/wrangler.json
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: packages/coffee.chealt.com
          command: deploy
          # A new coffee-pr-<N> worker starts without secrets; seed the ones the site needs
          secrets: |
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            SESSION_SECRET
            TURSO_AUTH_TOKEN
            TURSO_AUTH_TOKEN_TEST
            TURSO_DATABASE_URL
            TURSO_DATABASE_URL_TEST
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_AUTH_TOKEN_TEST: ${{ secrets.TURSO_AUTH_TOKEN_TEST }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_DATABASE_URL_TEST: ${{ secrets.TURSO_DATABASE_URL_TEST }}
  website-test:
    runs-on: ubuntu-latest
    needs: deploy-preview
    strategy:
      # A failing shard must not cancel the others, they still have reports to upload
      fail-fast: false
      matrix:
        # The number of parallel jobs the UI tests are split into. Add or remove entries
        # to change it - `strategy.job-total` follows the length of this list, so the
        # shard count lives here alone.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Get Playwright version
        id: playwright_version
        working-directory: packages/coffee.chealt.com
        shell: bash
        run: |
          version=$(yarn info @playwright/test --json | jq -r '.children.Version')
          echo "version=$version" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        name: Get Playwright from cache
        id: cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright_version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright Browsers
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn workspace @centralbeans/website playwright install --with-deps chromium
      # A newly created preview host answers only once Cloudflare has added the DNS record
      # and issued its certificate, which takes minutes on the first deploy of a PR
      - name: Wait for the preview host
        run: |
          for attempt in $(seq 1 60); do
            if curl -sSf -o /dev/null --max-time 20 "https://${{ env.PREVIEW_HOST }}/"; then
              echo "Preview host is up after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: https://${{ env.PREVIEW_HOST }}/ is not answering yet."
            sleep 15
          done
          echo "Preview host never came up."
          exit 1
      - name: Run Playwright tests
        env:
          baseUrl: https://${{ env.PREVIEW_HOST }}
          CI: true
          identityHeaderValue: ${{ secrets.IDENTITY_HEADER_VALUE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          shardIndex: ${{ matrix.shard }}
          shardTotal: ${{ strategy.job-total }}
        run: yarn workspace @centralbeans/website playwright test
      - uses: actions/upload-artifact@v7
        name: Upload Playwright report
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/coffee.chealt.com/playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        name: Upload A11y report
        if: always()
        with:
          name: a11y-report-shard-${{ matrix.shard }}
          path: packages/coffee.chealt.com/a11y-report/
          retention-days: 30
      - uses: aws-actions/configure-aws-credentials@v6
        if: always()
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      # Every shard writes a complete report of its own slice, so each one gets its own
      # prefix instead of overwriting the previous shard's upload
      - name: Upload files to AWS
        id: report-upload
        if: always()
        env:
          REPORT_PREFIX: preview/pr-${{ github.event.pull_request.number }}/shard-${{ matrix.shard }}
        run: |
          aws s3 sync packages/coffee.chealt.com/playwright-report/ s3://centralbeans-playwright-reports/test-reports/$REPORT_PREFIX
          aws s3 sync packages/coffee.chealt.com/a11y-report/ s3://centralbeans-playwright-reports/a11y-reports/$REPORT_PREFIX
      - name: Report test report upload status
        if: always()
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
              -d '{"context":"UI Tests - preview / report (shard ${{ matrix.shard }}/${{ strategy.job-total }})","state":"${{ steps.report-upload.outcome }}","target_url":"https://playwright-reports.centralbeans.com/test-reports/preview/pr-${{ github.event.pull_request.number }}/shard-${{ matrix.shard }}/index.html"}'
  # The tests share a single user and the cleanup deletes all of its passkeys, so it can
  # only run once every shard is done - a shard running it would break the others
  passkey-cleanup:
    runs-on: ubuntu-latest
    needs: website-test
    if: always() && needs.website-test.result != 'skipped'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Get Playwright version
        id: playwright_version
        working-directory: packages/coffee.chealt.com
        shell: bash
        run: |
          version=$(yarn info @playwright/test --json | jq -r '.children.Version')
          echo "version=$version" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        name: Get Playwright from cache
        id: cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright_version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Playwright Browsers
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn workspace @centralbeans/website playwright install --with-deps chromium
      - name: Delete the passkeys left behind by the shards
        env:
          baseUrl: https://${{ env.PREVIEW_HOST }}
          CI: true
          identityHeaderValue: ${{ secrets.IDENTITY_HEADER_VALUE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: yarn workspace @centralbeans/website playwright test --project=cleanup
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Delete preview worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/coffee.chealt.com
          command: delete --name coffee-pr-${{ github.event.pull_request.number }}
