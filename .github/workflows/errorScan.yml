name: Scan AWS Errors
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Report only: no commits, no task creation, no dispatch'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Never run two scans in parallel: both would commit to agent-tasks/.
concurrency:
  group: errorScan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GIT_WRITE_TOKEN }}
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'yarn'
      - run: yarn install --immutable
      # Not a yarn devDependency: its binary comes from an install script, which yarn disables.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2
      - name: Scan AWS for errors
        run: yarn workspace @centralbeans/error-scanner scan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dryRun }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_VERDICT_MODEL: ${{ vars.AGENT_VERDICT_MODEL || 'claude-sonnet-5' }}
