AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch Alarm for Trigger Github Action errors

Resources:
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: triggerGithubActionErrors
  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: alarm@centralbeans.com
      Protocol: email
      TopicArn: !Ref AlarmNotificationTopic
  triggerGithubActionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: triggerGithubActionErrors
      Tags: []
      ActionsEnabled: true
      OKActions: []
      AlarmActions:
        - !Ref AlarmNotificationTopic
      InsufficientDataActions: []
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: triggerGithubAction
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
